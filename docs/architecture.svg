<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
<title id="title">Patent Innovation Agent architecture</title>
<desc id="desc">Architecture showing React frontend, Cloud Run FastAPI and Google ADK agents, Gemini, BigQuery patents, demand signals, and asynchronous analysis jobs.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker>
  <style>
    .box{fill:#fff;stroke:#334155;stroke-width:2;rx:14} .cloud{fill:#f8fafc;stroke:#0f172a;stroke-width:2;rx:20}
    .agent{fill:#eef2ff;stroke:#4f46e5;stroke-width:2;rx:12} .data{fill:#ecfeff;stroke:#0891b2;stroke-width:2;rx:12}
    .ui{fill:#f0fdf4;stroke:#16a34a;stroke-width:2;rx:12} .warn{fill:#fff7ed;stroke:#ea580c;stroke-width:2;rx:12}
    text{font-family:Inter,Arial,sans-serif;fill:#0f172a} .h{font-size:24px;font-weight:700}.s{font-size:16px}.tiny{font-size:13px;fill:#475569}
    .line{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)} .dashed{stroke-dasharray:8 7}
  </style>
</defs>
<rect width="1600" height="980" fill="#f8fafc"/>
<text x="70" y="60" class="h">Patent Innovation Agent — production architecture</text>
<text x="70" y="88" class="tiny">Asynchronous research → white-space discovery → invention → adversarial validation → scoring</text>

<!-- User/frontend -->
<rect x="60" y="150" width="300" height="300" class="ui"/>
<text x="85" y="190" class="h">Frontend</text>
<text x="85" y="220" class="s">React + Vite</text>
<rect x="85" y="250" width="250" height="62" class="box"/><text x="105" y="276" class="s">Opportunity Map</text><text x="105" y="298" class="tiny">landscape, clusters, scorecards</text>
<rect x="85" y="330" width="250" height="62" class="box"/><text x="105" y="356" class="s">Agent Activity Feed</text><text x="105" y="378" class="tiny">live stages, decisions, evidence</text>
<rect x="85" y="410" width="250" height="22" fill="none" stroke="none"/><text x="85" y="430" class="tiny">POST /api/analyze → job_id</text>

<!-- Cloud run -->
<rect x="410" y="125" width="820" height="700" class="cloud"/>
<text x="440" y="170" class="h">Google Cloud Run — FastAPI + Google ADK runtime</text>
<text x="440" y="196" class="tiny">One deployed service; async job execution; Gemini-backed agent graph</text>

<!-- API -->
<rect x="445" y="230" width="230" height="120" class="box"/>
<text x="465" y="263" class="s">FastAPI API</text>
<text x="465" y="289" class="tiny">/api/landscape</text>
<text x="465" y="310" class="tiny">/api/analyze</text>
<text x="465" y="331" class="tiny">/api/analyze/{job_id}</text>

<!-- Orchestration -->
<rect x="720" y="215" width="475" height="430" fill="#faf5ff" stroke="#7c3aed" stroke-width="2" rx="16"/>
<text x="745" y="250" class="s" font-weight="700">Google ADK orchestration</text>
<rect x="750" y="280" width="190" height="70" class="agent"/>
<text x="770" y="308" class="s">research_agent</text><text x="770" y="331" class="tiny">search / cite / similar</text>
<rect x="970" y="280" width="190" height="70" class="agent"/>
<text x="990" y="308" class="s">clustering tool</text><text x="990" y="331" class="tiny">CPC + white-space score</text>
<path d="M940 315 H970" class="line"/>
<rect x="750" y="390" width="410" height="110" fill="#eef2ff" stroke="#4f46e5" stroke-width="2" rx="12"/>
<text x="770" y="420" class="s">invention_loop — LoopAgent</text>
<rect x="770" y="438" width="170" height="45" class="agent"/><text x="790" y="466" class="tiny">inventor_agent</text>
<rect x="960" y="438" width="180" height="45" class="warn"/><text x="978" y="466" class="tiny">adversarial_agent</text>
<path d="M940 460 H960" class="line"/><path d="M960 490 C900 530 790 530 770 483" class="line"/>
<rect x="750" y="540" width="410" height="70" class="agent"/>
<text x="770" y="570" class="s">governor_agent</text><text x="770" y="592" class="tiny">novelty · risk · differentiation · evidence</text>
<path d="M955 500 V540" class="line"/>

<!-- Gemini -->
<rect x="770" y="680" width="390" height="75" class="box"/>
<text x="790" y="711" class="s">Gemini 3.5 Flash / Vertex AI or Gemini API</text>
<text x="790" y="734" class="tiny">LLM backing for every LlmAgent</text>
<path d="M955 645 V680" class="line"/>

<!-- Data sources -->
<rect x="1270" y="150" width="280" height="170" class="data"/>
<text x="1295" y="188" class="h">Patent data</text>
<text x="1295" y="218" class="s">Google Patents Public Datasets</text>
<text x="1295" y="246" class="tiny">BigQuery: patents-public-data</text>
<text x="1295" y="270" class="tiny">real datasource / local mock switch</text>
<path d="M1270 235 H1195" class="line"/>

<rect x="1270" y="365" width="280" height="170" class="data"/>
<text x="1295" y="403" class="h">Demand signals</text>
<text x="1295" y="433" class="s">SBIR / CORDIS</text>
<text x="1295" y="461" class="tiny">market-pull technology needs</text>
<text x="1295" y="485" class="tiny">mock / real datasource switch</text>
<path d="M1270 450 H1195" class="line"/>

<!-- state -->
<rect x="445" y="690" width="230" height="100" class="data"/>
<text x="465" y="722" class="s">Run state</text>
<text x="465" y="748" class="tiny">ADK session state (current)</text>
<text x="465" y="770" class="tiny">Firestore = persistence upgrade</text>
<path d="M560 350 V690" class="line dashed"/>

<!-- event flow -->
<rect x="60" y="535" width="300" height="210" class="warn"/>
<text x="85" y="575" class="h">Autonomous execution</text>
<text x="85" y="607" class="s">Background job</text>
<text x="85" y="634" class="tiny">queued → researching → clustering</text>
<text x="85" y="657" class="tiny">→ inventing → adversarial → scoring</text>
<text x="85" y="680" class="tiny">→ completed / failed</text>
<text x="85" y="714" class="tiny">Live events feed the UI.</text>
<path d="M360 330 H410" class="line"/>
<path d="M410 610 H360" class="line"/>

<!-- result -->
<rect x="1270" y="600" width="280" height="190" class="ui"/>
<text x="1295" y="640" class="h">Verified opportunity</text>
<text x="1295" y="670" class="tiny">candidate + adversarial verdict</text>
<text x="1295" y="694" class="tiny">scorecard + cited prior art</text>
<text x="1295" y="718" class="tiny">“Kill my invention” review</text>
<text x="1295" y="742" class="tiny">→ actionable invention brief</text>
<path d="M1195 610 H1270" class="line"/>

<!-- legend -->
<text x="70" y="900" class="s" font-weight="700">Legend</text>
<rect x="70" y="920" width="20" height="20" class="agent"/><text x="100" y="936" class="tiny">Agent / orchestration</text>
<rect x="270" y="920" width="20" height="20" class="data"/><text x="300" y="936" class="tiny">Data / state</text>
<rect x="450" y="920" width="20" height="20" class="ui"/><text x="480" y="936" class="tiny">User-facing</text>
<rect x="620" y="920" width="20" height="20" class="warn"/><text x="650" y="936" class="tiny">Decision / execution</text>
</svg>

sonar.projectKey=Abell-Systems_nexus
sonar.organization=abell-systems
sonar.sourceEncoding=UTF-8

# Source & Test paths following Clean Architecture layout
sonar.sources=backend/src/main,frontend/src/main
sonar.tests=backend/test,frontend/test

# Language specific options
sonar.python.version=3.12
# One report, pre-merged in CI from both test suites' raw coverage data (coverage combine),
# not two separate paths here — Sonar's own multi-report merge across coverage.xml (core suite)
# and coverage-providers.xml (ADK provider suite, a disjoint set of files) was not unioning them
# correctly, undercounting files only the provider suite exercises. See sonar-quality-gate in
# .github/workflows/ci.yml for the merge step.
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Performance optimization: Disable SonarJasmin (JsSecuritySensorV2) deep taint analyzer.
#
# Technical Scope & Architectural Invariant (ADR 0008, ADR 0021, ADR 0024):
# 1. Scanner-engine scope: sonar.jasmin.internal.disabled is an internal engine property
#    in SonarSource's JS/TS analyzer plugin (eslint-bridge / JasminAstConsumer). SonarScanner
#    provides no sub-path qualifier syntax for internal sensor flags.
# 2. Nexus monorepo reality: 100% of core backend runtime is Python (backend/src/main).
#    The ONLY JS/TS source code in sonar.sources is frontend/src/main (pure client-side React SPA
#    with no Node runtime and zero server taint sources). Jasmin spent 257.1s (~80% of CI)
#    traversing client React ASTs without security findings.
# 3. Non-regression automated gate: scripts/check_architecture.py deterministically enforces
#    via CI that all JS/TS files in the repository reside exclusively within approved client SPA
#    workspaces (frontend/ and nexus-status/frontend/). Any introduction of server-side or
#    auxiliary JS/TS fails the Architecture Quality Gate in CI (Job 1), preventing any uninspected
#    security surface from entering the repository without explicit review.
sonar.jasmin.internal.disabled=true


# Quality Gate and Analysis Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/__pycache__/**,data/**,backend/test/fixtures/**
sonar.coverage.exclusions=backend/test/**,frontend/test/**,scripts/**,data/**

# python:S2245 ("pseudorandom number generator ... security-sensitive") in
# blind_export.py: random.Random(seed).shuffle() is a deterministic,
# reproducible shuffle for annotation-batch ordering (PR-E, ADR 0019 spec §5
# contract 3) -- not a cryptographic or security-sensitive use. An inline
# NOSONAR comment does not suppress this rule (it is not settable via
# in-file comment for Sonar's Python analyzer), so it is scoped here instead,
# to this exact rule and file only.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.e1.resourceKey=backend/src/main/infrastructure/annotation/blind_export.py

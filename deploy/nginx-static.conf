# Serves the built white-space page and nothing else: no API, no matcher, no proxy. Runs as the unprivileged nginx user
# on a read-only filesystem; everything nginx writes lives in /tmp (a tmpfs in the Compose file).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /health {
      default_type text/plain;
      return 200 "ok\n";
    }

    # The data of vertical 3 (unobserved pairs) is copied into the frontend ahead of its view. It is not served here until the
    # exposure conditions of docs/whitespace/product-vertical-3-contract.md are met (access record, M1-M7, visual review);
    # the pull request that exposes the view removes this block.
    location = /data/oepm-unobserved-pairs-results.json {
      return 404;
    }

    # Files only. The matcher route (/matches) is not deployed here, so it is a 404, never the page.
    location / {
      try_files $uri $uri/ =404;
    }
  }
}

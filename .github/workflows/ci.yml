name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

jobs:
  # 1. Architecture Quality Gate (Minimal Tooling: zero framework/runtime overhead)
  architecture:
    name: 1. Architecture Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Architecture Checker Tooling
        run: pip install import-linter>=2.14
      - name: Run Architecture Quality Gate
        run: python scripts/check_architecture.py

  # 2. Python Static Quality & Type Checking (Core + Dev Tooling)
  python-quality:
    name: 2. Python Quality (Ruff & Mypy)
    needs: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Static Code Analysis (Ruff)
        run: ruff check backend/src/main backend/test scripts
      - name: Static Type Checking (Mypy)
        run: mypy backend/src/main --ignore-missing-imports

  # 3. Frontend Quality & Build (Fast Direct node_modules Cache + Parallel Execution)
  frontend-quality:
    name: 3. Frontend Quality & Build
    needs: architecture
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache node_modules
        id: frontend-node-modules-cache
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: frontend-node-modules-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install dependencies
        if: steps.frontend-node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Tests & Coverage
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production Build
        run: npm run build
      - name: Upload Frontend Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/lcov.info

  # 4. Security & Secret Scanning (Parallel with Python/Frontend)
  security-scan:
    name: 4. Security Scan (Gitleaks)
    needs: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz
          tar -xzf gitleaks_8.24.0_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/
          rm -f gitleaks_8.24.0_linux_x64.tar.gz
      - name: Run Gitleaks Secret Scanner
        run: gitleaks detect --source . --verbose

  # 5. Core Tests & Coverage Execution (Pure core runtime, zero provider SDKs)
  backend-tests:
    name: 5. Core Backend Tests & Coverage
    needs: [architecture, python-quality]
    runs-on: ubuntu-latest
    env:
      COVERAGE_FILE: .coverage.core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Unit Tests
        run: pytest backend/test/unit -v --cov=backend/src/main --cov-report=xml:coverage.xml
      - name: Integration Tests
        run: pytest backend/test/integration -v --cov=backend/src/main --cov-append --cov-report=xml:coverage.xml
      - name: E2E Reproducibility Gate & Coverage Verification (Strict Fail Under)
        run: pytest backend/test/e2e -v --cov=backend/src/main --cov-append --cov-report=xml:coverage.xml --cov-report=term-missing --cov-fail-under=80
      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
      # Raw .coverage data (not the XML) so Sonar gets one correctly-merged report instead of
      # two independent XMLs — see the coverage-merge step in sonar-quality-gate for why.
      # include-hidden-files: actions/upload-artifact@v4 excludes dotfiles by default and only
      # warns (doesn't fail) when nothing matches — silently dropping .coverage.core here is what
      # produced "Artifact not found" two jobs later in sonar-quality-gate instead of failing here
      # where it's obvious. if-no-files-found: error makes a future path/name typo fail loudly at
      # the point of the mistake instead.
      - name: Upload Raw Coverage Data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-core
          path: .coverage.core
          include-hidden-files: true
          if-no-files-found: error

  # 5b. Provider Tests (Google ADK & Provider Adapters)
  provider-adk-tests:
    name: 5b. Provider Tests (Google ADK)
    needs: [architecture, python-quality]
    runs-on: ubuntu-latest
    env:
      COVERAGE_FILE: .coverage.providers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/requirements-adk.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt -r backend/requirements-adk.txt
      - name: Run Provider Tests
        run: pytest backend/test/providers -v --cov=backend/src/main --cov-report=xml:coverage-providers.xml
      - name: Upload Provider Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: provider-coverage-report
          path: coverage-providers.xml
      - name: Upload Raw Coverage Data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-providers
          path: .coverage.providers
          include-hidden-files: true
          if-no-files-found: error

  # 6. Sonar Analysis & Quality Gate. Skipped with a build warning (not a hard failure) when
  # SONAR_TOKEN is unset, so a revoked/missing external token can't brick the pipeline — ruff+mypy
  # already cover a lot of the same static-analysis ground locally. The final quality-gate summary
  # below reports this run as explicitly SKIPPED/UNVERIFIED rather than folding it into a plain
  # PASS: absence of Sonar evidence must never be reported as evidence Sonar passed.
  sonar-quality-gate:
    name: 6. Sonar Quality Gate
    needs: [backend-tests, provider-adk-tests, frontend-quality]
    runs-on: ubuntu-latest
    outputs:
      skipped: ${{ steps.check_token.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check SONAR_TOKEN secret existence
        id: check_token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::warning::SONAR_TOKEN secret is not configured in repository secrets. Skipping SonarCloud analysis for this run (ruff+mypy static analysis still ran and gate the pipeline)."
            echo ""
            echo "To enable SonarCloud analysis:"
            echo "1. Create/configure SonarCloud project 'Abell-Systems_nexus' in organization 'abell-systems'."
            echo "2. Generate a SonarCloud token at https://sonarcloud.io/account/security."
            echo "3. Add the token to GitHub repository secrets under the name SONAR_TOKEN."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      # Merge the two suites' raw coverage data (rather than feeding Sonar two separate XML
      # reports via sonar.python.coverage.reportPaths) because Sonar's own multi-report merge
      # was not unioning them correctly: files only exercised by the ADK provider suite (which
      # needs google-adk, unavailable in the core suite's job) were coming through as ~0%
      # covered even though the provider suite covered them at 77-100%, which was enough on its
      # own to fail the "coverage on new code" gate. `coverage combine` does the union correctly
      # at the source, so Sonar is handed one accurate report instead of resolving the ambiguity
      # itself.
      - name: Set up Python
        if: steps.check_token.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download Core Coverage Data
        if: steps.check_token.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: coverage-data-core
      - name: Download Provider Coverage Data
        if: steps.check_token.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: coverage-data-providers
      - name: Merge Coverage Data Into a Single Report
        if: steps.check_token.outputs.skip != 'true'
        run: |
          pip install coverage
          python -m coverage combine .coverage.core .coverage.providers
          python -m coverage xml -o coverage.xml
      - name: Download Frontend Coverage Report
        if: steps.check_token.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage
      - name: SonarQube Cloud Scan
        if: steps.check_token.outputs.skip != 'true'
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: SonarQube Cloud Quality Gate
        if: steps.check_token.outputs.skip != 'true'
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # 7. Final Consolidated Quality Gate (Must be all green)
  quality-gate:
    name: 7. QUALITY GATE (Ready to Merge)
    needs: [architecture, python-quality, frontend-quality, security-scan, backend-tests, provider-adk-tests, sonar-quality-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm All Strict Quality Gates Passed
        env:
          SONAR_SKIPPED: ${{ needs.sonar-quality-gate.outputs.skipped }}
        run: |
          echo "================================================================="
          echo "All Strict Quality Gates Passed (Clean Code & Clean Architecture)"
          echo " - Architecture Gate: PASS"
          echo " - Ruff Static Analysis: PASS"
          echo " - Mypy Type Checking: PASS"
          echo " - Frontend Tests, Lint & Build: PASS"
          echo " - Gitleaks Secret Scanner: PASS"
          echo " - Backend Core Tests (Unit, Integration, E2E): PASS"
          echo " - Provider Tests (Google ADK): PASS"
          echo " - Coverage Threshold Gate (>=80%): PASS"
          if [ "$SONAR_SKIPPED" = "true" ]; then
            echo "::warning::SonarCloud Analysis & Quality Gate was SKIPPED (SONAR_TOKEN not configured). This run is UNVERIFIED by Sonar, not a Sonar pass — configure SONAR_TOKEN to close this gap."
            echo " - SonarCloud Analysis & Quality Gate: SKIPPED (SONAR_TOKEN not configured) — UNVERIFIED, not PASS"
          else
            echo " - SonarCloud Analysis & Quality Gate: PASS"
          fi
          echo "================================================================="

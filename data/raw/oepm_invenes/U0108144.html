cio lleva su interior divide en dos espacios sensiblemente desiguales en anchura dedicando el miés ancho abierto hacia una cara frontal del mueble a alejar elementos de servicio del bar y/ o libros objetos de adorno y similares estando adecuadamente subdividido para ella mientras que el espacio de menor anchura esté a su vez subdividido en altura en dos compartimentos superpuestos siendo el inferior da altura reducida el alojamiento de un motor de un sistema de refrigeración da cualquier modalidad mientras que el superior que ocupa en altura el resto de la altura de la caja os una cámara de refrigeración donde se alejan las bebidas y comestibles adecuados para el servicio del bar.<br></span></td>               </tr>            </table><br><span style="color: #1F1F1F;font-size:9pt;font-family:Arial;">                     INVENES no es un registro, sino una base de datos de divulgación técnica. En caso               de requerir  información actualizada sobre la situación legal del expediente o relativa a sus datos bibliográficos, debe consultar               la base de datos 											<a href="http://ceo.oepm.es/detalleExpediente?numExp=U000108144" target="_blank" TITLE="Consulta de Expedientes OEPM">                  "CEO"</a>,															                     accesible desde la página web de la OEPM, o pinchando en el icono <img src="https://consultas2.oepm.es/InvenesWeb/iconos/justicia.gif" valign="top" border="0" alt="Consulta de Expedientes OEPM"><br></span><br><br></td>      </tr>   </table></div></label>

			function setFooter(){
				$('body').height(''); 
				$('#pie').css('top', '');

				var wh = $(window).height();
				var ph = $('.navbar-footer').height();

				var ntp = wh-tp-ph-4;

				  	$('#pie').css({top: ntp+"px"});

			// Se utiliza un evento delegado puesto que el contenido es dinámico y se carga después del DOM.
			$('div.tab-content').on({

			    	var h3 = $(this);

			    		if ($(this).is(':visible')) {
				    		h3.html(h3.html().replace("+ ", "- "));

				    		h3.html(h3.html().replace("- ", "+ "));

ende:<br/><br/> - una lámina de metal resistente a la corrosión, y el desplegado de una lámina metálica para proporcionar una lámina de metal perforada, la cual posee una pluralidad de filamentos que definen aberturas entre las mismas, y<br/><br/> - un recubrimiento de por lo menos parte de la superficie de una lámina metálica, que puede ser efectuado antes o después del desplegado de la misma, con una capa, adherente de un material catalizador capaz de catalizar la reducción del NOx;<br/><br/> siendo una lámina de metal resistente a la corrosión el material inicial para las fases de desplegado o de recubrimiento, o siendo formado después del desplegado de una lámina metálica no resistente a la corrosión antes de dicho recubrimiento, o siendo formado simultáneamente a la formación de dicho recubrimiento.<br></span></td>               </tr>            </table><br><span style="color: #1F1F1F;font-size:9pt;font-family:Arial;">                     INVENES no es un registro, sino una base de datos de divulgación técnica. En caso               de requerir  información actualizada sobre la situación legal del expediente o relativa a sus datos bibliográficos, debe consultar               la base de datos 											<a href="http://ceo.oepm.es/detalleExpediente?numExp=P000403392" target="_blank" TITLE="Consulta de Expedientes OEPM">                  "CEO"</a>,															                     accesible desde la página web de la OEPM, o pinchando en el icono <img src="https://consultas2.oepm.es/InvenesWeb/iconos/justicia.gif" valign="top" border="0" alt="Consulta de Expedientes OEPM"><br></span><br><br></td>      </tr>   </table></div></label>

			function setFooter(){
				$('body').height(''); 
				$('#pie').css('top', ''); 
				var bh = $('body').height(); 
				var wh = $(window).height();
				var ph = $('.navbar-footer').height();
				var tp = $('.navbar-footer').offset().top;
				var ntp = wh-tp-ph-4;
				if(bh < wh){
				  	$('body').height(wh);
				  	$('#pie').css({top: ntp+"px"});
				}
			}
			setFooter();
			
			$(window).resize(function(){
				setTimeout(function(){ setFooter(); }, 600);

			// En la vista móvil, muestra el título de la pestaña seleccionada
			$('#navbar ul.navbar-nav li a').on('click', function() {
				$('span.navbar-brand').html($(this).html());

			// Crea el efecto "pestañas" para los subapartados de cada contenido.
			// Se utiliza un evento delegado puesto que el contenido es dinámico y se carga después del DOM.
			$('div.tab-content').on({
			    click: function() {
			    	var h3 = $(this);
			    	h3.next('div').slideToggle(function() {
			    		if ($(this).is(':visible')) {
				    		h3.html(h3.html().replace("+ ", "- "));
				    	}
				    	else {
				    		h3.html(h3.html().replace("- ", "+ "));
				    	}
			    	});
			    }

			// Muestra/oculta el botón para hacer scroll top

				}
				else {
					$('.irAlPrincipio').css("display", "none");
				}
			});

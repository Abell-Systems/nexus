                <label id="form1:datosBibliograficos"><div>   <table width="100%" style="font-size:11pt;list-style-type: square;">      <tr>         <td valign="top" width="70%"><br><span style="color:#424242;text-transform:uppercase;font-size:12pt;font-family:Arial;"><b>LIMPIADORA-ENCERADORA DE FRUTOS.<br></b></span><br><table style="font-size:11pt;list-style-type: square">               <tr>                  <td valign="top"><span style="color: #424242;font-size:11pt;white-space: nowrap ;font-family:Arial;"><b>          Número de publicación: 													</b></span></td>                  <td><span style="color: #1F1F1F;font-size:11pt;white-space: nowrap ;text-transform:uppercase;font-family:Arial;"><a href="https://consultas2.oepm.es/pdf/ES/0000/000/00/17/05/ES-0170520_U.pdf" target="_blank" style="color:navy; font-size:11pt;text-transform:uppercase;" TITLE="Ver documento PDF">ES0170520</a>&nbsp;U&nbsp;(16.11.1971)</span></td>               </tr>            </table>            <table style="font-size:11pt;list-style-type: square">               <tr>                  <td valign="top"><span style="color:#424242;font-size:11pt;white-space: nowrap ;font-family:Arial;"><b>          También publicado como: 													</b></span></td>                  <td><span style="color: #1F1F1F;font-size:11pt;white-space: nowrap ;text-transform:uppercase;font-family:Arial;">ES0170520&nbsp;Y&nbsp;(16.05.1972)</span><BR></td>               </tr>            </table>            <table style="font-size:11pt;list-style-type: square">               <tr>                  <td valign="top"><span style="color:#424242;font-size:11pt;white-space: nowrap ;font-family:Arial;"><b>          Número de Solicitud: 													</b></span></td>                  <td width="300"><span style="color: #1F1F1F;font-size:11pt;white-space: nowrap ;text-transform:uppercase;font-family:Arial;valign='center'"><a href="http://ceo.oepm.es/detalleExpediente?numExp=U000170520" target="_blank" style="color:navy;font-size:11pt;text-transform:uppercase;" TITLE="Consulta de Expedientes OEPM"><img src="https://consultas2.oepm.es/InvenesWeb/iconos/justicia.gif" align="left" valign="top" border="0" alt="Consulta de Expedientes OEPM (C.E.O.)"></a>                  &nbsp;U0170520          &nbsp;(02.07.1971)</span><br></td>               </tr>            </table>            <table style="font-size:11pt;list-style-type: square">               <tr>                  <td valign="top"><span style="color:#424242;font-size:11pt;white-space: nowrap ;font-family:Arial;"><b>          Solicitante: 													</b></span></td>                  <td><span style="color: #1F1F1F;font-size:11pt;font-family:Arial;">DECCO-IBERICA, S. A.      (ES)												<br>VILLA DE MADRID, 50,P.IND.FUENTE DEL JARRO,PATERNA,VALENCIA</span></td>               </tr>            </table>            <table style="font-size:11pt;list-style-type: square">               <tr>                  <td valign="top"><span style="color:#424242;font-size:11pt;white-space: nowrap ;font-family:Arial;"><b>              CIP anterior a 2006.01: 														</b></span></td>                  <td><span style="color: #1F1F1F;font-size:11pt;text-transform:uppercase;font-family:Arial;"><b>A23N</b></span></td>               </tr>            </table>            <table style="font-size:11pt;list-style-type: square">               <tr>                  <td valign="top"><span style="color:#424242;font-size:11pt;white-space: nowrap ;font-family:Arial;"><b>                  Primera reivindicación: 															</b></span></td>                  <td valign="top"><span style="color: #1F1F1F;font-size:11pt;font-family:Arial;">Limpiadora-enceradora de pisos, caracterizada esencialmente porque está constituida a partir de un tren transportador continuo de rodillos rotativos, los cuales en un primer sector de entrada del fruto, con asisten en cepillos cilíndricos, ventajosamente de nylon, sobre cuyo sector esta dispuesta una alineación transversal de boquillas nebulizadoras, de una conducción a presión de una solución jabonosa o detergente adecuada, preparada en un depósito; al final de dicho primer sector comprende sendas alineaciones transversales de boquillas nebulizadoras de una conducción de agua a presión; a continuación el tren transportador presenta un sector intermedio de rodillos de naturaleza esponjosa igualmente rotativos, cada uno de los cuales presenta inferiormente unos rodillos libres que presionan a los esponjosos, actuando estos últimos de secadores del fruto transportado, mientras que los inferiores actuan de escurridores de los primeros, estando este segundo sector del tren transportador separado del primero por una cortina flexible transversal; por último un sector del tren transportador está constituido por cepillos cilíndricos, ventajosamente de naturaleza de cerdas o similares, sobre los cuales esta dispuesto un puente gula de deslizamiento transversal alternativo de un carro. movido a través de una ranura por un pivote saliente lateral de una cadena cerrada sobre sendos engranajes, cuyo carro presenta un soporte de acoplamiento vertical de una boquilla nebulizadora de una disolución de cera; comprendiendo además a lo largo del total del tren transportador sendas cadenas de arrastre paralelas superiores, entre las cuales comportan transversalmente unos rastrillos que, pasando entre las distintas dichas boquillas y los rodillos arrastran al fruto, temporizando su tratamiento.<br></span></td>               </tr>            </table><br><span style="color: #1F1F1F;font-size:9pt;font-family:Arial;">                     INVENES no es un registro, sino una base de datos de divulgación técnica. En caso               de requerir  información actualizada sobre la situación legal del expediente o relativa a sus datos bibliográficos, debe consultar               la base de datos 											<a href="http://ceo.oepm.es/detalleExpediente?numExp=U000170520" target="_blank" TITLE="Consulta de Expedientes OEPM">                  "CEO"</a>,															                     accesible desde la página web de la OEPM, o pinchando en el icono <img src="https://consultas2.oepm.es/InvenesWeb/iconos/justicia.gif" valign="top" border="0" alt="Consulta de Expedientes OEPM"><br></span><br><br></td>      </tr>   </table></div></label>

		<script>
			function setFooter(){
				$('body').height(''); 
				$('#pie').css('top', ''); 
				var bh = $('body').height(); 
				var wh = $(window).height();
				var ph = $('.navbar-footer').height();
				var tp = $('.navbar-footer').offset().top;
				var ntp = wh-tp-ph-4;
				if(bh < wh){
				  	$('body').height(wh);
				  	$('#pie').css({top: ntp+"px"});
				}
			}
			setFooter();
			
			$(window).resize(function(){
				setTimeout(function(){ setFooter(); }, 600);
			});
			
			// En la vista móvil, muestra el título de la pestaña seleccionada
			$('#navbar ul.navbar-nav li a').on('click', function() {
				$('span.navbar-brand').html($(this).html());
			});
			
			// Crea el efecto "pestañas" para los subapartados de cada contenido.
			// Se utiliza un evento delegado puesto que el contenido es dinámico y se carga después del DOM.
			$('div.tab-content').on({
			    click: function() {
			    	var h3 = $(this);
			    	h3.next('div').slideToggle(function() {
			    		if ($(this).is(':visible')) {
				    		h3.html(h3.html().replace("+ ", "- "));
				    	}
				    	else {
				    		h3.html(h3.html().replace("- ", "+ "));
				    	}
			    	});
			    }
			}, '.tab-pane.active div.tabbertab > h3');
			
			// Muestra/oculta el botón para hacer scroll top
			$(document).on("scroll", function() {
				if ($(this).scrollTop() > 60) {
					$('.irAlPrincipio').css("display", "block");
				}
				else {
					$('.irAlPrincipio').css("display", "none");
				}
			});
			
			function descargarTIFFoPDF2(data, campo) {
				var div = $('#'+campo);
				if (div.length > 0) {
					div.prepend('<iframe width="100%" height="500px" class="hidden-xs" src="' + data + '"><a href="' + data+ '" ></a><' + '/iframe>');
				}
			}
			
			$(function() {
				var imagen = document.getElementById('form1:origenObject');
				if (null != imagen) {
					descargarTIFFoPDF2(imagen.value, 'contenedorIMG');
					$('#linkDescargaImagen').attr('href', imagen.value);
				}
				
				for (var i = 1; i < 9; i++) {
					var url = document.getElementById('form1:inputHidden'+i).value;
					descargarTIFFoPDF2(url+'#pagemode=none', 'contenedorPDF'+i);
				}
				
				$('span.navbar-brand').html($('#navbar ul.navbar-nav li.active a').html());
			});
		</script>

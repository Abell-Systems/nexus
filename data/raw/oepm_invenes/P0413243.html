dido introducido y de lingote de metal de aleación por unidad de tiempo de modo que la cantidad introducida de los materiales de partida en dicho horno de mezcla y la cantidad descargada de la aleación fundida desde dicho horno de mufla pueda mantenerse en un estado de equilibrio aproximado.<br></span></td>               </tr>            </table><br><span style="color: #1F1F1F;font-size:9pt;font-family:Arial;">                     INVENES no es un registro, sino una base de datos de divulgación técnica. En caso               de requerir  información actualizada sobre la situación legal del expediente o relativa a sus datos bibliográficos, debe consultar               la base de datos 											<a href="http://ceo.oepm.es/detalleExpediente?numExp=P000413243" target="_blank" TITLE="Consulta de Expedientes OEPM">                  "CEO"</a>,															                     accesible desde la página web de la OEPM, o pinchando en el icono <img src="https://consultas2.oepm.es/InvenesWeb/iconos/justicia.gif" valign="top" border="0" alt="Consulta de Expedientes OEPM"><br></span><br><br></td>      </tr>   </table></div></label>

			function setFooter(){
				$('body').height(''); 
				$('#pie').css('top', ''); 
				var bh = $('body').height(); 
				var wh = $(window).height();
				var ph = $('.navbar-footer').height();
				var tp = $('.navbar-footer').offset().top;
				var ntp = wh-tp-ph-4;
				if(bh < wh){
				  	$('body').height(wh);
				  	$('#pie').css({top: ntp+"px"});
				}
			}
			setFooter();
			
			$(window).resize(function(){
				setTimeout(function(){ setFooter(); }, 600);
			});
			
			// En la vista móvil, muestra el título de la pestaña seleccionada
			$('#navbar ul.navbar-nav li a').on('click', function() {
				$('span.navbar-brand').html($(this).html());
			});
			
			// Crea el efecto "pestañas" para los subapartados de cada contenido.
			// Se utiliza un evento delegado puesto que el contenido es dinámico y se carga después del DOM.
			$('div.tab-content').on({
			    click: function() {
			    	var h3 = $(this);
			    	h3.next('div').slideToggle(function() {
			    		if ($(this).is(':visible')) {
				    		h3.html(h3.html().replace("+ ", "- "));
				    	}
				    	else {
				    		h3.html(h3.html().replace("- ", "+ "));
				    	}
			    	});
			    }
			}, '.tab-pane.active div.tabbertab > h3');
			
			// Muestra/oculta el botón para hacer scroll top
			$(document).on("scroll", function() {
				if ($(this).scrollTop() > 60) {

				}
				else {
					$('.irAlPrincipio').css("display", "none");
				}
			});
			
			function descargarTIFFoPDF2(data, campo) {
				var div = $('#'+campo);
				if (div.length > 0) {
					div.prepend('<iframe width="100%" height="500px" class="hidden-xs" src="' + data + '"><a href="' + data+ '" ></a><' + '/iframe>');
				}
			}
			
			$(function() {
				var imagen = document.getElementById('form1:origenObject');
				if (null != imagen) {
					descargarTIFFoPDF2(imagen.value, 'contenedorIMG');

				}

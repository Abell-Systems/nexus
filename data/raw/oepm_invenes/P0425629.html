pan></td>                  <td valign="top"><span style="color: #1F1F1F;font-size:11pt;font-family:Arial;">Procedimiento de tratamiento de aguas que contienen sulfitos pro transformación de estos últimos en sulfatos mediante oxidación, caracterizados porque se realiza la oxidación de los sulfitos presentes en las aguas a tratar en una concentración previamente determinada, mediante introducción de oxígeno en el líquido bajo la forma de una fina dispersión, realizándose la reacción de oxidación a un pH ligeramente alcalino, a una temperatura comprendida ventajosamente entre 20ºC y 80ºC y en presencia de un catalizador constituido por hierro metálico que presenta una gran superficie para el contacto de la mezcla de líquido y de oxígeno, teniendo las aguas tratadas vertidas al alcantarillado un contenido máximo de sulfatos que es inferior a 970 ppm de sulfato de metal alcalino por litro de aguas residuales tratadas.<br></span></td>               </tr>            </table><br><span style="color: #1F1F1F;font-size:9pt;font-family:Arial;">                     INVENES no es un registro, sino una base de datos de divulgación técnica. En caso               de requerir  información actualizada sobre la situación legal del expediente o relativa a sus datos bibliográficos, debe consultar               la base de datos 											<a href="http://ceo.oepm.es/detalleExpediente?numExp=P000425629" target="_blank" TITLE="Consulta de Expedientes OEPM">                  "CEO"</a>,															                     accesible desde la página web de la OEPM, o pinchando en el icono <img src="https://consultas2.oepm.es/InvenesWeb/iconos/justicia.gif" valign="top" border="0" alt="Consulta de Expedientes OEPM"><br></span><br><br></td>      </tr>   </table></div></label>

				var wh = $(window).height();

			// Se utiliza un evento delegado puesto que el contenido es dinámico y se carga después del DOM.
			$('div.tab-content').on({
			    click: function() {
			    	var h3 = $(this);
			    	h3.next('div').slideToggle(function() {
			    		if ($(this).is(':visible')) {
				    		h3.html(h3.html().replace("+ ", "- "));
				    	}
				    	else {
				    		h3.html(h3.html().replace("- ", "+ "));

			    	});

				else {
					$('.irAlPrincipio').css("display", "none");
				}
			});

                <label id="form1:datosBibliograficos"><div>   <table width="100%" style="font-size:11pt;list-style-type: square;">      <tr>         <td valign="top" width="70%"><br><span style="color:#424242;text-transform:uppercase;font-size:12pt;font-family:Arial;"><b>Un método para la recuperación de anhídrido sulfuroso.<br></b></span><br><table style="font-size:11pt;list-style-type: square">               <tr>                  <td valign="top"><span style="color: #424242;font-size:11pt;white-space: nowrap ;font-family:Arial;"><b>          Número de publicación: 													</b></span></td>                  <td><span style="color: #1F1F1F;font-size:11pt;white-space: nowrap ;text-transform:uppercase;font-family:Arial;"><a href="https://consultas2.oepm.es/pdf/ES/0000/000/00/14/65/ES-0146575_A1.pdf" target="_blank" style="color:navy; font-size:11pt;text-transform:uppercase;" TITLE="Ver documento PDF">ES0146575</a>&nbsp;A1&nbsp;(01.03.1941)</span></td>               </tr>            </table>            <table style="font-size:11pt;list-style-type: square">               <tr>                  <td valign="top"><span style="color:#424242;font-size:11pt;white-space: nowrap ;font-family:Arial;"><b>          Número de Solicitud: 													</b></span></td>                  <td width="300"><span style="color: #1F1F1F;font-size:11pt;white-space: nowrap ;text-transform:uppercase;font-family:Arial;valign='center'"><a href="http://ceo.oepm.es/detalleExpediente?numExp=P000146575" target="_blank" style="color:navy;font-size:11pt;text-transform:uppercase;" TITLE="Consulta de Expedientes OEPM"><img src="https://consultas2.oepm.es/InvenesWeb/iconos/justicia.gif" align="left" valign="top" border="0" alt="Consulta de Expedientes OEPM (C.E.O.)"></a>                  &nbsp;P0146575          &nbsp;(07.02.1939)</span><br></td>               </tr>            </table>            <table style="font-size:11pt;list-style-type: square">               <tr>                  <td valign="top"><span style="color:#424242;font-size:11pt;white-space: nowrap ;font-family:Arial;"><b>          Solicitante: 													</b></span></td>                  <td><span style="color: #1F1F1F;font-size:11pt;font-family:Arial;">Guggenheim Brothers      (US)												<br>New York, Estados Unidos</span></td>               </tr>            </table>            <table style="font-size:11pt;list-style-type: square">               <tr>                  <td valign="top"><span style="color:#424242;font-size:11pt;white-space: nowrap ;font-family:Arial;"><b>              CIP anterior a 2006.01: 														</b></span></td>                  <td><span style="color: #1F1F1F;font-size:11pt;text-transform:uppercase;font-family:Arial;"><b>C01B</b></span></td>               </tr>            </table>            <table style="font-size:11pt;list-style-type: square">               <tr>                  <td valign="top"><span style="color:#424242;font-size:11pt;white-space: nowrap ;font-family:Arial;"><b>                  Resumen: 															</b></span></td>                  <td valign="top"><span style="color: #1F1F1F;font-size:11pt;font-family:Arial;">Un procedimiento para recuperar bióxido sulfúrico de gases que lo contengan, poniendo en contacto los gases con un líquido absorbente que contiene dimetil-anilina, calentando el líquido absorbente para dejar libre el bióxido sulfúrico absorbido por el mismo, y recogiendo el bióxido sulfúrico libertado; caracterizado por la formación de una serie de capas de líquido absorbente haciendo fluir dimetil-anilina hacia abajo por aparatos del tipo de torre de placas de burbujas, pasando los gases hacia arriba al través de la torre y por las capas de líquido absorbente formadas en el interior a presión virtualmente atmosférica para efectuar la absorción del bióxido sulfúrico contenido en los gases, refrigerando una o más de las capas para disipar el calor desarrollado durante la absorción y mantener la dimetil-anilina del interior a una temperatura tal que facilite la absorción del bióxido sulfúrico, y retirando de la parte inferior de la torre una solución consistente esencialmente en bióxido sulfúrico y dimetil-anilina.<br></span></td>               </tr>            </table><br><span style="color: #1F1F1F;font-size:9pt;font-family:Arial;">                     INVENES no es un registro, sino una base de datos de divulgación técnica. En caso               de requerir  información actualizada sobre la situación legal del expediente o relativa a sus datos bibliográficos, debe consultar               la base de datos 											<a href="http://ceo.oepm.es/detalleExpediente?numExp=P000146575" target="_blank" TITLE="Consulta de Expedientes OEPM">                  "CEO"</a>,															                     accesible desde la página web de la OEPM, o pinchando en el icono <img src="https://consultas2.oepm.es/InvenesWeb/iconos/justicia.gif" valign="top" border="0" alt="Consulta de Expedientes OEPM"><br></span><br><br></td>      </tr>   </table></div></label>

an style="color:#424242;font-size:11pt;white-space: nowrap ;font-family:Arial;"><b>          Solicitante: 													</b></span></td>                  <td><span style="color: #1F1F1F;font-size:11pt;font-family:Arial;">ALLIED CHEMICAL CORP.</span></td>               </tr>            </table>            <table style="font-size:11pt;list-style-type: square">               <tr>                  <td valign="top"><span style="color:#424242;font-size:11pt;white-space: nowrap ;font-family:Arial;"><b>              CIP anterior a 2006.01: 														</b></span></td>                  <td><span style="color: #1F1F1F;font-size:11pt;text-transform:uppercase;font-family:Arial;"><b>F25B15/04</b></span></td>               </tr>            </table>            <table style="font-size:11pt;list-style-type: square">               <tr>                  <td valign="top"><span style="color:#424242;font-size:11pt;white-space: nowrap ;font-family:Arial;"><b>                  Resumen: 															</b></span></td>                  <td valign="top"><span style="color: #1F1F1F;font-size:11pt;font-family:Arial;">Perfeccionamientos en los sistemas de refrigeración, caracterizados por que el sistema comprende: (a) un tanque de almacenado de amoníaco líquido; (b) un evaporador en el que el amoníaco líquido es vaporizado por absorción de calor procedente de los alrededores del evaporador; (c) un conducto para transportar amoníaco líquido desde el tanque de almacenado al evaporador; (d) medios para lograr la combustión del amoníaco vaporizado; (e) un conducto para transportar el amoníaco vaporizado desde el evaporador a los medios para lograr la combustión del amoníaco vaporizado; y (f) medios para regular el caudal de amoníaco por el sistema de refrigeración.<br></span></td>               </tr>            </table><br><span style="color: #1F1F1F;font-size:9pt;font-family:Arial;">                     INVENES no es un registro, sino una base de datos de divulgación técnica. En caso

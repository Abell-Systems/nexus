</b></a>&nbsp;<i>(2006.01)</i></td>    <td></td>    <td></td> </tr>                     </table>                  </td>               </tr>            </table>            <table style="font-size:11pt;list-style-type: square">               <tr>                  <td valign="top"><span style="color:#424242;font-size:11pt;white-space: nowrap ;font-family:Arial;"> <table>    <tr>       <td><b><acronym style="color:#424242;font-size:11pt;white-space: nowrap ;font-family:Arial;" title="Clasificación Cooperativa de Patentes ">CPC:</acronym></b></td>    </tr> </table></span></td>                  <td>                     <table> <tr>    <td><a href="http://worldwide.espacenet.com/classification?locale=es_LP#!/CPC=C01B7/04" target="_blank" style="color:navy; font-size:11pt;text-transform:uppercase;"><b>C01B7/04</b>&nbsp;				</a> 					(EP)			    </td>    <td></td>    <td><a href="http://worldwide.espacenet.com/classification?locale=es_LP#!/CPC=C01B7/096" target="_blank" style="color:navy; font-size:11pt;text-transform:uppercase;"><b>C01B7/096</b>&nbsp;					</a>					(EP)				    </td>    <td></td>    <td></td> </tr>                     </table>                  </td>               </tr>            </table>            <table style="font-size:11pt;list-style-type: square">               <tr>                  <td valign="top"><span style="color:#424242;font-size:11pt;white-space: nowrap ;font-family:Arial;"><b>                  Resumen: 															</b></span></td>                  <td valign="top"><span style="color: #1F1F1F;font-size:11pt;font-family:Arial;">Procedimiento para producir cloro o bromo a partir del haluro de hidrógeno respectivo en un sistema de reacción, manteniéndose dentro de dicho sistema un exceso estequiométrico de nitrógeno activo con respecto a dicho haluro de hidrógeno en dicho sistema, caracterizado por que comprende: introducir ácido sulfúrico en la parte superior o cabeza de dicho sistema de reacción para que fluya en sentido descendente como la fase líquida; introducir por debajo de una zona de reacción, dentro de dicho sistema de reacción, el haluro de hidrógeno en una cantidad estequiométricamente inferior al nitrógeno activo presente en dicho sistema, por lo que dicho haluro de hidrógeno penetra en la zona de reacción como haluro de hidrógeno o haluro de nitrosilo; reaccionar en dicha zona de reacción nitrógeno activo con una valencia en exceso de 3 con dicho haluro de hidrógeno o haluro de nitrosilo para producir dicho cloro o bromo que fluye del sistema en contracorriente a la fase líquida y ácido nitrosisulfúrico que forma parte de la fase líquida; introducir vapor de agua en la fase líquida en una zona de regeneración del sistema de reacción por lo que el ácido nitrosisulfúrico se separa de la fase líquida y se regenera como una mezcla de monóxido de nitrógeno y dióxido de nitrógeno; y oxidar dicho monóxido de nitrógeno en la zona de regeneración, por lo que por lo menos una cantidad estequeométrica de dióxido de nitrógeno en fase gaseosa se introduce en la zona de reacción si se compara con el haluro de hidrógeno o haluro de nitrosilo.<br></span></td>               </tr>            </table><br><span style="color: #1F1F1F;font-size:9pt;font-family:Arial;">                     INVENES no es un registro, sino una base de datos de divulgación técnica. En caso               de requerir  información actualizada sobre la situación legal del expediente o relativa a sus datos bibliográficos, debe consultar               la base de datos 											<a href="http://ceo.oepm.es/detalleExpediente?numExp=P000437308" target="_blank" TITLE="Consulta de Expedientes OEPM">                  "CEO"</a>,															                     accesible desde la página web de la OEPM, o pinchando en el icono <img src="https://consultas2.oepm.es/InvenesWeb/iconos/justicia.gif" valign="top" border="0" alt="Consulta de Expedientes OEPM"><br></span><br><br></td>      </tr>   </table></div></label>

		<script>
			function setFooter(){
				$('body').height(''); 
				$('#pie').css('top', ''); 
				var bh = $('body').height(); 
				var wh = $(window).height();
				var ph = $('.navbar-footer').height();
				var tp = $('.navbar-footer').offset().top;
				var ntp = wh-tp-ph-4;
				if(bh < wh){
				  	$('body').height(wh);
				  	$('#pie').css({top: ntp+"px"});
				}
			}
			setFooter();
			
			$(window).resize(function(){
				setTimeout(function(){ setFooter(); }, 600);
			});
			
			// En la vista móvil, muestra el título de la pestaña seleccionada
			$('#navbar ul.navbar-nav li a').on('click', function() {
				$('span.navbar-brand').html($(this).html());
			});
			
			// Crea el efecto "pestañas" para los subapartados de cada contenido.
			// Se utiliza un evento delegado puesto que el contenido es dinámico y se carga después del DOM.
			$('div.tab-content').on({
			    click: function() {
			    	var h3 = $(this);
			    	h3.next('div').slideToggle(function() {
			    		if ($(this).is(':visible')) {
				    		h3.html(h3.html().replace("+ ", "- "));
				    	}
				    	else {
				    		h3.html(h3.html().replace("- ", "+ "));
				    	}
			    	});
			    }
			}, '.tab-pane.active div.tabbertab > h3');
			
			// Muestra/oculta el botón para hacer scroll top
			$(document).on("scroll", function() {
				if ($(this).scrollTop() > 60) {
					$('.irAlPrincipio').css("display", "block");
				}
				else {
					$('.irAlPrincipio').css("display", "none");
				}
			});
			
			function descargarTIFFoPDF2(data, campo) {
				var div = $('#'+campo);
				if (div.length > 0) {
					div.prepend('<iframe width="100%" height="500px" class="hidden-xs" src="' + data + '"><a href="' + data+ '" ></a><' + '/iframe>');
				}
			}
			
			$(function() {
				var imagen = document.getElementById('form1:origenObject');
				if (null != imagen) {
					descargarTIFFoPDF2(imagen.value, 'contenedorIMG');
					$('#linkDescargaImagen').attr('href', imagen.value);
				}
				
				for (var i = 1; i < 9; i++) {
					var url = document.getElementById('form1:inputHidden'+i).value;

			function setFooter(){
				$('body').height(''); 
				$('#pie').css('top', ''); 
				var bh = $('body').height(); 
				var wh = $(window).height();
				var ph = $('.navbar-footer').height();
				var tp = $('.navbar-footer').offset().top;
				var ntp = wh-tp-ph-4;
				if(bh < wh){
				  	$('body').height(wh);
				  	$('#pie').css({top: ntp+"px"});
				}
			}
			setFooter();
			
			$(window).resize(function(){
				setTimeout(function(){ setFooter(); }, 600);
			});
			
			// En la vista móvil, muestra el título de la pestaña seleccionada
			$('#navbar ul.navbar-nav li a').on('click', function() {
				$('span.navbar-brand').html($(this).html());
			});
			
			// Crea el efecto "pestañas" para los subapartados de cada contenido.
			// Se utiliza un evento delegado puesto que el contenido es dinámico y se carga después del DOM.
			$('div.tab-content').on({
			    click: function() {
			    	var h3 = $(this);
			    	h3.next('div').slideToggle(function() {
			    		if ($(this).is(':visible')) {
				    		h3.html(h3.html().replace("+ ", "- "));
				    	}
				    	else {
				    		h3.html(h3.html().replace("- ", "+ "));
				    	}
			    	});
			    }
			}, '.tab-pane.active div.tabbertab > h3');
			
			// Muestra/oculta el botón para hacer scroll top
			$(document).on("scroll", function() {
				if ($(this).scrollTop() > 60) {
					$('.irAlPrincipio').css("display", "block");
				}
				else {
					$('.irAlPrincipio').css("display", "none");
				}
			});
			
			function descargarTIFFoPDF2(data, campo) {
				var div = $('#'+campo);
				if (div.length > 0) {
					div.prepend('<iframe width="100%" height="500px" class="hidden-xs" src="' + data + '"><a href="' + data+ '" ></a><' + '/iframe>');
				}
			}
			
			$(function() {
				var imagen = document.getElementById('form1:origenObject');
				if (null != imagen) {
					descargarTIFFoPDF2(imagen.value, 'contenedorIMG');
					$('#linkDescargaImagen').attr('href', imagen.value);
				}
				
				for (var i = 1; i < 9; i++) {
					var url = document.getElementById('form1:inputHidden'+i).value;
					descargarTIFFoPDF2(url+'#pagemode=none', 'contenedorPDF'+i);
				}
				
				$('span.navbar-brand').html($('#navbar ul.navbar-nav li.active a').html());
			});
		</script>

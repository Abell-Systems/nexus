 lateralmente comporta los brazos propiamente dichos de soporte en basculación de dicho cazo de trabajo, con la particularidad de que este dicho cazo de trabajo actúa en preferencia con una misma inclinación por el condicionamiento de un brazo superior determinante en la proyección de un paralelogramo deformable y dotado este brazo superior de medios de regulación y soltado, realizándose los desplazamientos de trabajo bajo la solicitación de un cilindro de impulsión hidráulica presionada en los medios propios del vehículo de acoplamiento.<br></span></td>               </tr>            </table><br><span style="color: #1F1F1F;font-size:9pt;font-family:Arial;">                     INVENES no es un registro, sino una base de datos de divulgación técnica. En caso               de requerir  información actualizada sobre la situación legal del expediente o relativa a sus datos bibliográficos, debe consultar               la base de datos 											<a href="http://ceo.oepm.es/detalleExpediente?numExp=P000449935" target="_blank" TITLE="Consulta de Expedientes OEPM">                  "CEO"</a>,															                     accesible desde la página web de la OEPM, o pinchando en el icono <img src="https://consultas2.oepm.es/InvenesWeb/iconos/justicia.gif" valign="top" border="0" alt="Consulta de Expedientes OEPM"><br></span><br><br></td>      </tr>   </table></div></label>

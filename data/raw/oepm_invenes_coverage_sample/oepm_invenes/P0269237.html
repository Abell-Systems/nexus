   <td valign="top"><span style="color:#424242;font-size:11pt;white-space: nowrap ;font-family:Arial;"><b>          Solicitante: 													</b></span></td>                  <td><span style="color: #1F1F1F;font-size:11pt;font-family:Arial;">OXY-CATALYST, INCORPORATED      (US)												</span></td>               </tr>            </table>            <table style="font-size:11pt;list-style-type: square">               <tr>                  <td valign="top"><span style="color:#424242;font-size:11pt;white-space: nowrap ;font-family:Arial;"> <table>    <tr>       <td><b><acronym style="color:#424242;font-size:11pt;white-space: nowrap ;font-family:Arial;" title="Clasificación Internacional de Patentes ">CIP:</acronym></b></td>    </tr> </table></span></td>                  <td>                     <table> <tr>    <td><a href="https://pubcip.oepm.es/?notion=scheme&symbol=B01D0053000000&menulang=es&lang=es&viewmode=f&fipcpc=no&showdeleted=yes&indexes=no&headings=yes&notes=yes&direction=o2n&initial=A&cwid=none&tree=no&searchmode=smart" target="_blank" style="color:navy; font-size:11pt;text-transform:uppercase;"><b><i>B01D53/00</i></b></a>&nbsp;<i>(2006.01)</i></td>    <td></td>    <td></td>    <td></td> </tr>                     </table>                  </td>               </tr>            </table>            <table style="font-size:11pt;list-style-type: square">               <tr>                  <td valign="top"><span style="color:#424242;font-size:11pt;white-space: nowrap ;font-family:Arial;"><b>                  Resumen: 															</b></span></td>                  <td valign="top"><span style="color: #1F1F1F;font-size:11pt;font-family:Arial;">Un aparato para purificar los gases de escape para su uso en un motor de combustión interna alternativo de ignición por chispa, adaptado para funcionar con gasolina plomada, que comprende un dispositivo para mezclar aire con los gases de escape, y un purificador catalítico de escape para recibir los gases de escape y aire añadido que comprende una envolvente y un lecho del catalizador de oxidación en forma de píldoras distribuidas al azar dentro de dicha envolvente, estando provista dicha envolvente con medios de guía para conducir los gases de escape y el aire añadido a través de dicho lecho, presentando dicho lecho a los gases de escape y al aire añadido una sección transversal ortogonal a la dirección del flujo, que está comprendida entre 9.680 cm2 a 206.500 cm2 por 453 gr de combustible consumido por minuto por el motor en las condiciones de operación que corresponde al mínimo de energía total de la mezcla de gases de escape y aire añadido que entra en el lecho catalizador, y teniendo dicho lecho un espesor aproximadamente uniforme en la dirección de flujo comprendido en el intervalo de aproximadamente 7,6 mm y 76 mm, proporcionando dichas píldoras de catalizador un área de superficie geométrica comprendida en el intervalo de 45,2 cm/cm3 y 98,3 cm/cm3 de desplazamiento del pistón del motor.<br></span></td>               </tr>            </table><br><span style="color: #1F1F1F;font-size:9pt;font-family:Arial;">                     INVENES no es un registro, sino una base de datos de divulgación técnica. En caso               de requerir  información actualizada sobre la situación legal del expediente o relativa a sus datos bibliográficos, debe consultar               la base de datos 											<a href="http://ceo.oepm.es/detalleExpediente?numExp=P000269237" target="_blank" TITLE="Consulta de Expedientes OEPM">                  "CEO"</a>,															                     accesible desde la página web de la OEPM, o pinchando en el icono <img src="https://consultas2.oepm.es/InvenesWeb/iconos/justicia.gif" valign="top" border="0" alt="Consulta de Expedientes OEPM"><br></span><br><br></td>      </tr>   </table></div></label>

			function setFooter(){
				$('body').height(''); 
				$('#pie').css('top', ''); 
				var bh = $('body').height(); 
				var wh = $(window).height();
				var ph = $('.navbar-footer').height();
				var tp = $('.navbar-footer').offset().top;
				var ntp = wh-tp-ph-4;
				if(bh < wh){
				  	$('body').height(wh);
				  	$('#pie').css({top: ntp+"px"});
				}
			}
			setFooter();
			
			$(window).resize(function(){
				setTimeout(function(){ setFooter(); }, 600);
			});
			
			// En la vista móvil, muestra el título de la pestaña seleccionada
			$('#navbar ul.navbar-nav li a').on('click', function() {
				$('span.navbar-brand').html($(this).html());
			});
			
			// Crea el efecto "pestañas" para los subapartados de cada contenido.
			// Se utiliza un evento delegado puesto que el contenido es dinámico y se carga después del DOM.
			$('div.tab-content').on({
			    click: function() {
			    	var h3 = $(this);
			    	h3.next('div').slideToggle(function() {
			    		if ($(this).is(':visible')) {
				    		h3.html(h3.html().replace("+ ", "- "));
				    	}
				    	else {
				    		h3.html(h3.html().replace("- ", "+ "));
				    	}
			    	});
			    }
			}, '.tab-pane.active div.tabbertab > h3');
			
			// Muestra/oculta el botón para hacer scroll top
			$(document).on("scroll", function() {
				if ($(this).scrollTop() > 60) {
					$('.irAlPrincipio').css("display", "block");
				}
				else {
					$('.irAlPrincipio').css("display", "none");
				}
			});

				var div = $('#'+campo);

					div.prepend('<iframe width="100%" height="500px" class="hidden-xs" src="' + data + '"><a href="' + data+ '" ></a><' + '/iframe>');
				}
			}
			
			$(function() {

				if (null != imagen) {

				}

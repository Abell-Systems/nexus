                <label id="form1:datosBibliograficos"><div>   <table width="100%" style="font-size:11pt;list-style-type: square;">      <tr>         <td valign="top" width="70%"><br><span style="color:#424242;text-transform:uppercase;font-size:12pt;font-family:Arial;"><b>PERFECCIONAMIENTOS EN CULTIVADORES ROTATIVOS DE CUCHILLAS<br></b></span><br><table style="font-size:11pt;list-style-type: square">               <tr>                  <td valign="top"><span style="color: #424242;font-size:11pt;white-space: nowrap ;font-family:Arial;"><b>          Número de publicación: 													</b></span></td>                  <td><span style="color: #1F1F1F;font-size:11pt;white-space: nowrap ;text-transform:uppercase;font-family:Arial;"><a href="https://consultas2.oepm.es/pdf/ES/0000/000/00/28/72/ES-0287275_A1.pdf" target="_blank" style="color:navy; font-size:11pt;text-transform:uppercase;" TITLE="Ver documento PDF">ES0287275</a>&nbsp;A1&nbsp;(16.07.1963)</span></td>               </tr>            </table>            <table style="font-size:11pt;list-style-type: square">               <tr>                  <td valign="top"><span style="color:#424242;font-size:11pt;white-space: nowrap ;font-family:Arial;"><b>          Número de Solicitud: 													</b></span></td>                  <td width="300"><span style="color: #1F1F1F;font-size:11pt;white-space: nowrap ;text-transform:uppercase;font-family:Arial;valign='center'"><a href="http://ceo.oepm.es/detalleExpediente?numExp=P000287275" target="_blank" style="color:navy;font-size:11pt;text-transform:uppercase;" TITLE="Consulta de Expedientes OEPM"><img src="https://consultas2.oepm.es/InvenesWeb/iconos/justicia.gif" align="left" valign="top" border="0" alt="Consulta de Expedientes OEPM (C.E.O.)"></a>                  &nbsp;P0287275          &nbsp;(22.04.1963)</span><br></td>               </tr>            </table>            <table style="font-size:11pt;list-style-type: square">               <tr>                  <td valign="top"><span style="color:#424242;font-size:11pt;white-space: nowrap ;font-family:Arial;"><b>          Solicitante: 													</b></span></td>                  <td><span style="color: #1F1F1F;font-size:11pt;font-family:Arial;">GINER LANGA, RAFAEL      (ES)												<br>VALENCIA</span></td>               </tr>            </table>            <table style="font-size:11pt;list-style-type: square">               <tr>                  <td valign="top"><span style="color:#424242;font-size:11pt;white-space: nowrap ;font-family:Arial;"><b>              CIP anterior a 2006.01: 														</b></span></td>                  <td><span style="color: #1F1F1F;font-size:11pt;text-transform:uppercase;font-family:Arial;"><b>A01B</b></span></td>               </tr>            </table>            <table style="font-size:11pt;list-style-type: square">               <tr>                  <td valign="top"><span style="color:#424242;font-size:11pt;white-space: nowrap ;font-family:Arial;"><b>                  Resumen: 															</b></span></td>                  <td valign="top"><span style="color: #1F1F1F;font-size:11pt;font-family:Arial;">PERFECCIONAMIENTOS EN CULTIVADORES ROTATIVOS DE CUCHILLAS, caracterizados esencialmente por el hecho de establecer una relación entre la placa extrema de unión entre las barras de soporte y el eje de herramientas, con estos tres elementos a través, en el primer caso, de unas almas telescópicas guiadas en relación con la envolvente a través de sendas chavetas, mientras en el segundo caso, siendo la envolvente porta-herramientas la que se desplaza, el alma fija es un eje estriado que recibe directamente el movimiento a través de la caja de transmisión lateral, con lo que el eje porta-herramientas es desplazable a voluntad lateralmente para situarlo en diversas posiciones de trabajo; colaborando en sus distintas posiciones unos elementos de anclaje eventual integrados por una brida articulada unida por sus extremos al extremo anterior de la tapa de las herramientas y por el otro a aletas previstas en la envolvente estática de la barra superior de soporte, mientras que en su posición fija o inicial no desplazada, la tapa se fija a una aleta que en la caja de transmisión se ha establecido al efecto; siendo utilizado, en la parte inferior de la tapa, un casquillo guiado a lo largo de una varilla estática, colaborando en el desplazamiento un husillo con volante que se desplaza en un cilindro roscado interiormente y unido al conjunto estático en una posición intermedia entre las dos barras soporte.<br></span></td>               </tr>            </table><br><span style="color: #1F1F1F;font-size:9pt;font-family:Arial;">                     INVENES no es un registro, sino una base de datos de divulgación técnica. En caso               de requerir  información actualizada sobre la situación legal del expediente o relativa a sus datos bibliográficos, debe consultar               la base de datos 											<a href="http://ceo.oepm.es/detalleExpediente?numExp=P000287275" target="_blank" TITLE="Consulta de Expedientes OEPM">                  "CEO"</a>,															                     accesible desde la página web de la OEPM, o pinchando en el icono <img src="https://consultas2.oepm.es/InvenesWeb/iconos/justicia.gif" valign="top" border="0" alt="Consulta de Expedientes OEPM"><br></span><br><br></td>      </tr>   </table></div></label>

			function setFooter(){
				$('body').height(''); 
				$('#pie').css('top', '');

				var wh = $(window).height();

			$('div.tab-content').on({

				    		h3.html(h3.html().replace("+ ", "- "));

				    	else {
				    		h3.html(h3.html().replace("- ", "+ "));
